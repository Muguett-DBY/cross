name: Verify pnpm Git authentication on current Renovate main
on:
  push:
    branches: [probe/pnpm-auth-current-main-2026-10-27]
    paths:
      - .github/workflows/probe-pnpm-auth-current-main.yml
      - validation/pnpm-auth/**
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: renovatebot/renovate
          ref: 3c91a90df917386441a3d373d6f3e52836d25849
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.6
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Verify forwarding and causal regression controls
        run: python3 -B validation/pnpm-auth/probe.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renovate-pnpm-auth-current-main
          path: reports/
          if-no-files-found: error
          retention-days: 7
