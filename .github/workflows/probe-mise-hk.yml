name: Verify Renovate selected tool metadata
on:
  push:
    branches: [probe/mise-hk-artifacts-2026-10-27]
    paths:
      - .github/workflows/probe-mise-hk.yml
      - validation/mise-hk/**
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Muguett-DBY/renovate
          ref: dafa4dcf670599c9573abf850ef46570e99dcabe
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.6
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Verify real aqua update and scoped regressions
        run: python3 -B validation/mise-hk/probe.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renovate-mise-hk-verification
          path: reports/
          if-no-files-found: error
          retention-days: 7
