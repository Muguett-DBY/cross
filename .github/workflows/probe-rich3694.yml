{
  "name": "Verify Rich numbered menu with existing API",
  "on": {
    "push": {
      "branches": [
        "probe/rich-numbered-menu-2026-10-26"
      ],
      "paths": [
        "validation/rich3694/**",
        ".github/workflows/probe-rich3694.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "verify": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 6,
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "PYTHONUTF8": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Check exact snippet with valid and invalid stdin sequences",
          "run": "python -B -X utf8 validation/rich3694/probe.py"
        },
        {
          "uses": "actions/upload-artifact@v6",
          "if": "always()",
          "with": {
            "name": "rich3694-numbered-menu",
            "path": "reports/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
