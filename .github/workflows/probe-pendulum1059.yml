{
  "name": "Review Pendulum Windows timezone mappings",
  "on": {
    "push": {
      "branches": [
        "probe/pendulum-windows-mapping-2026-10-26"
      ],
      "paths": [
        "validation/pendulum1059/**",
        ".github/workflows/probe-pendulum1059.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "verify": {
      "name": "Independent review (${{ matrix.os }})",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": [
            "ubuntu-24.04",
            "windows-latest"
          ]
        }
      },
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 15,
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "PYTHONUTF8": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Build exact PR, run both test modes, exercise registry reads and CLDR offsets",
          "run": "python -B -X utf8 validation/pendulum1059/probe.py"
        },
        {
          "uses": "actions/upload-artifact@v6",
          "if": "always()",
          "with": {
            "name": "pendulum1059-${{ matrix.os }}",
            "path": "reports/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
