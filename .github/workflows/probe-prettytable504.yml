{
  "name": "Verify PrettyTable slicing isolation",
  "on": {
    "push": {
      "branches": [
        "probe/prettytable-slice-review-2026-10-26"
      ],
      "paths": [
        "validation/prettytable504/**",
        ".github/workflows/probe-prettytable504.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "verify": {
      "name": "${{ matrix.os }} / Python 3.12",
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 12,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": [
            "ubuntu-24.04",
            "windows-2025"
          ]
        }
      },
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "PYTHONUTF8": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@v6",
          "with": {
            "repository": "prettytable/prettytable",
            "ref": "ea8d74e2a48acd6a8fdeb08fa356d3971953d8f4",
            "path": "source",
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install original project test dependencies",
          "run": "python -m pip install -e \"./source[tests]\""
        },
        {
          "name": "Run baseline, fixed, full-suite and extra slice controls",
          "run": "python -B -X utf8 validation/prettytable504/probe.py"
        },
        {
          "uses": "actions/upload-artifact@v6",
          "if": "always()",
          "with": {
            "name": "prettytable504-${{ matrix.os }}",
            "path": "reports/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
