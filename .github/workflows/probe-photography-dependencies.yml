name: Prepare combined photography dependency repair
on:
  push:
    branches: [probe/photography-dependencies-2026-10-27]
    paths:
      - .github/workflows/probe-photography-dependencies.yml
      - validation/photography-dependencies/combined.py
      - validation/photography-dependencies/vite.config.ts
permissions:
  contents: read
jobs:
  generate:
    name: combined-generation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm install --global npm@12.0.2
      - run: python -B validation/photography-dependencies/combined.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photography-combined-generation
          path: reports/
          if-no-files-found: error
          retention-days: 7
