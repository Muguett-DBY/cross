name: Verify photography dependency repairs
on:
  push:
    branches: [probe/photography-dependencies-2026-10-27]
    paths:
      - .github/workflows/probe-photography-dependencies.yml
      - validation/photography-dependencies/probe.py
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        kind: [tooling]
    name: photography-${{ matrix.kind }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm install --global npm@12.0.2
      - run: python -B validation/photography-dependencies/probe.py ${{ matrix.kind }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photography-${{ matrix.kind }}
          path: reports/
          if-no-files-found: error
          retention-days: 7
