{
  "name": "Format completed Datasette validation helper",
  "on": {
    "push": {
      "branches": [
        "maintenance/format-datasette-probe-2026-10-26"
      ],
      "paths": [
        "validation/actions-cleanup/**",
        ".github/workflows/format-datasette-probe.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "format": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Use project-pinned formatter only on this disposable runner",
          "run": "python -m pip install --no-cache-dir black==24.4.2"
        },
        {
          "name": "Format helper and verify formatting",
          "run": "python -m black validation/actions-cleanup/database_replacement.py\npython -m black --check validation/actions-cleanup/database_replacement.py"
        },
        {
          "uses": "actions/upload-artifact@v6",
          "with": {
            "name": "formatted-datasette-helper",
            "path": "validation/actions-cleanup/database_replacement.py",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
