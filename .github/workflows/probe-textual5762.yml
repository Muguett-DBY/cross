{
  "name": "Verify Textual puzzle regressions",
  "on": {
    "push": {
      "branches": [
        "probe/textual-demo-game-2026-10-26"
      ],
      "paths": [
        "validation/textual5762/**",
        ".github/workflows/probe-textual5762.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "verify": {
      "name": "${{ matrix.os }} / Python 3.12",
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 12,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": [
            "ubuntu-24.04",
            "windows-2025"
          ]
        }
      },
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "PYTHONUTF8": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@v6",
          "with": {
            "repository": "Textualize/textual",
            "ref": "5e5b7ef58b8c5572c13a3ff9027d756623661495",
            "path": "source",
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v6",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install the declared runtime and focused test tools",
          "run": "python -m pip install -e ./source \"pytest>=8.3,<9\" pytest-asyncio black==24.4.2"
        },
        {
          "name": "Verify main, the proposed diff, and the original PR head",
          "run": "python -B -X utf8 validation/textual5762/probe.py"
        },
        {
          "uses": "actions/upload-artifact@v6",
          "if": "always()",
          "with": {
            "name": "textual5762-${{ matrix.os }}",
            "path": "reports/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
